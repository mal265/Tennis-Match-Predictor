e rhero__inner`,children:[(0,f.jsx)(`p`,{className:`kicker`,children:`Research report · Roman Belchikov`}),(0,f.jsxs)(`h1`,{className:`rhero__title display`,children:[`Rankings already know`,(0,f.jsx)(`br`,{}),(0,f.jsx)(`em`,{children:`almost everything`})]}),(0,f.jsxs)(`p`,{className:`rhero__standfirst`,children:[`Eight models, `,O(j.dataset.matches),` ATP matches and four pre-match numbers. The best of them beat “just pick the higher-ranked player” by`,` `,(bt.lift*100).toFixed(1),` percentage points. This is the story of why that number is so small — and why that is the interesting result, not the disappointing one.`]}),(0,f.jsxs)(`dl`,{className:`rhero__facts`,children:[(0,f.jsx)(kt,{term:`Matches analysed`,detail:`${j.dataset.firstYear}–${j.dataset.lastYear}`,children:O(j.dataset.matches)}),(0,f.jsx)(kt,{term:`Baseline accuracy`,detail:`higher rank wins`,children:D(St,1)}),(0,f.jsx)(kt,{term:`Best model`,detail:bt.name.toLowerCase(),children:D(bt.accuracy,1)}),(0,f.jsx)(kt,{term:`Matches won by the underdog`,detail:`the irreducible part`,children:D(j.dataset.upsetRate,1)})]})]})}),(0,f.jsxs)(`div`,{className:`page research__layout`,children:[(0,f.jsxs)(`nav`,{className:`toc`,"aria-label":`Report contents`,children:[(0,f.jsx)(`p`,{className:`toc__title kicker`,children:`Contents`}),(0,f.jsx)(`ol`,{className:`toc__list`,children:wt.map(t=>(0,f.jsx)(`li`,{children:(0,f.jsx)(`a`,{href:`#${t.id}`,"aria-current":e===t.id,children:t.label})},t.id))})]}),(0,f.jsxs)(`div`,{className:`research__body`,children:[(0,f.jsxs)(Et,{id:`question`,eyebrow:`01`,title:`The question`,children:[(0,f.jsx)(`p`,{className:`lead`,children:`Before a match starts, what do we actually know? A ranking, a points total, two ages and two heights. The question this project set out to answer is whether that is enough — and, more pointedly, whether a machine-learning model can squeeze anything out of it that a tennis fan couldn't get by simply backing the better-ranked player.`}),(0,f.jsxs)(`p`,{children:[`That second half matters. Beating chance is trivial here: the favourite wins`,` `,D(j.dataset.favoriteWinRate,1),` of the time, so a rule with no model in it at all is already right about two matches in three. The bar is not 50%. The bar is`,` `,D(St,1),`, and it is a genuinely hard bar to clear.`]}),(0,f.jsx)(Dt,{children:`The competition isn't chance. It's a one-line rule that already works.`})]}),(0,f.jsxs)(Et,{id:`data`,eyebrow:`02`,title:`The data`,children:[(0,f.jsxs)(`p`,{children:[`The archive covers `,O(j.dataset.matches),` ATP matches between`,` `,j.dataset.firstYear,` and `,j.dataset.lastYear,` —`,` `,O(j.dataset.players),` players across `,O(j.dataset.tournaments),` tournaments, from Jeff Sackmann's public dataset. Matches missing a surface or either player's ranking were dropped; missing heights were filled with the column median.`]}),(0,f.jsxs)(`p`,{children:[`Each match becomes one row with a coin-flip assignment: one player is arbitrarily labelled A, and the model predicts whether A won. Every input is a difference —`,` `,(0,f.jsx)(`code`,{children:`rank_diff`}),`, `,(0,f.jsx)(`code`,{children:`points_diff`}),`, `,(0,f.jsx)(`code`,{children:`age_diff`}),`,`,` `,(0,f.jsx)(`code`,{children:`height_diff`}),` — so the model never learns that a particular name wins, only that a particular `,(0,f.jsx)(`em`,{children:`gap`}),` wins.`]}),(0,f.jsxs)(Ot,{title:`Why the split is by date, not at random`,children:[`Shuffling the rows would let the model train on 2023 and predict 2019, which is not a forecast — it is hindsight. Everything here trains on the earliest`,` `,O(j.dataset.trainMatches),` matches and is tested on the most recent`,` `,O(j.dataset.testMatches),`. Accuracies come out lower this way. They also mean something.`]})]}),(0,f.jsxs)(Et,{id:`scoreboard`,eyebrow:`03`,title:`The scoreboard`,children:[(0,f.jsxs)(`p`,{children:[`Eight approaches were tested: the favourite-wins rule, logistic regression, a decision tree, a random forest, gradient boosting, k-nearest neighbours, a linear SVM, and a neural network. They span most of the standard toolkit, from a one-line heuristic to a`,` `,ce.hidden.join(`–`),` hidden-unit network.`]}),(0,f.jsx)(at,{number:1}),(0,f.jsxs)(`p`,{children:[`The spread from best to worst is `,((bt.accuracy-xt.accuracy)*100).toFixed(1),` `,`percentage points. `,bt.name,` tops the table at `,D(bt.accuracy,1),`;`,` `,xt.name.toLowerCase(),` sits at the bottom on `,D(xt.accuracy,1),`, the only model that fails to beat the baseline at all. Everything else is bunched inside half a point of a rule you could write on a napkin.`]}),(0,f.jsx)(`p`,{children:`It is tempting to read that as failure. It is better read as a measurement: when a linear model, a tree ensemble and a neural network all converge on the same number, the ceiling is not in the algorithm. It is in the data.`})]}),(0,f.jsxs)(Et,{id:`signal`,eyebrow:`04`,title:`Where the signal is`,children:[(0,f.jsx)(`p`,{children:`If the four inputs are the whole world the model can see, it is worth asking which of them it is actually using. Three different models, scored three different ways, agree on the shape of the answer — with one wrinkle.`}),(0,f.jsx)(st,{number:2}),(0,f.jsxs)(`p`,{children:[`Age and height are close to noise. Shuffling height costs the network`,` `,(j.importance[3].permutation*100).toFixed(1),` percentage points of accuracy; shuffling age costs `,(j.importance[2].permutation*100).toFixed(1),`. Neither is doing meaningful work.`]}),(0,f.jsxs)(`p`,{children:[`The wrinkle is that ranking and ranking points split the credit unevenly, and not in the direction the summary usually claims. The decision tree gives`,` `,D(j.importance[1].treeImportance,0),` of its importance to`,` `,(0,f.jsx)(`em`,{children:`points`}),`, not rank. That is not a contradiction — it is collinearity. The two columns encode nearly the same fact, so a model picks one, leans on it, and leaves the other looking idle. The honest statement is that `,(0,f.jsx)(`strong`,{children:`ranking information`}),` `,`dominates, and which of its two columns carries that information is close to arbitrary.`]}),(0,f.jsx)(vt,{number:3}),(0,f.jsx)(`p`,{children:`The learned curve is flatter than intuition expects. A 100-place ranking advantage does not make a match a formality; it moves the needle to roughly the low seventies. Beyond about 150 places the curve barely climbs at all — the model has run out of things to say, because a #200 and a #400 look much the same from where it is standing.`})]}),(0,f.jsxs)(Et,{id:`easy`,eyebrow:`05`,title:`When prediction gets easy`,children:[(0,f.jsx)(`p`,{children:`Aggregate accuracy hides an important structure: the model is not uniformly mediocre. It is nearly useless in some matches and quite good in others, and the ranking gap is what separates the two.`}),(0,f.jsx)(ft,{number:4}),(0,f.jsxs)(`p`,{children:[`Between players within `,M.label,` ranking places of each other, the baseline is right `,D(M.baseline,1),` of the time — a coin flip with extra steps. Past`,` `,Ct.label,` places apart, it climbs to `,D(Ct.baseline,1),`. The predictable matches are the mismatches, and the mismatches are the ones nobody needed a model for.`]}),(0,f.jsx)(`p`,{children:`The obvious next suspects are surface and format. Surface turns out to matter remarkably little.`}),(0,f.jsx)(dt,{number:5}),(0,f.jsxs)(`p`,{children:[`Across `,O(j.dataset.matches),` matches the gap between the most and least favourite-friendly surface is`,` `,((j.bySurface[0].favoriteWinRate-Math.min(...j.bySurface.map(e=>e.favoriteWinRate)))*100).toFixed(1),` `,`percentage points. Clay's reputation for producing specialists and upsets does not show up at this resolution.`]}),(0,f.jsx)(`p`,{children:`Format, on the other hand, does.`}),(0,f.jsx)(mt,{number:6}),(0,f.jsxs)(`p`,{children:[`Favourites win `,D(j.byLevel[1].favoriteWinRate,1),` of Grand Slam matches against`,` `,D(j.byLevel[j.byLevel.length-1].favoriteWinRate,1),` on the regular tour. Best-of-five is a longer measurement of the same quantity, and longer measurements are less noisy. An underdog needs to be better for three hours, not for forty minutes.`]})]}),(0,f.jsxs)(Et,{id:`confidence`,eyebrow:`06`,title:`Trusting the number`,children:[(0,f.jsx)(`p`,{children:`Accuracy is a blunt way to judge a forecaster. A model that says “72%” and is right 72% of the time is doing its job even when it loses individual matches. So the more useful question is whether the probabilities mean what they say.`}),(0,f.jsx)(gt,{number:7}),(0,f.jsx)(`p`,{children:`Mostly, they do. Through the middle of the range the points sit close to the diagonal, which is the property that makes the output usable as a probability rather than a verdict. The tails drift — at the extremes the model is a little more confident than the results justify, which is exactly where a bettor would get hurt.`}),(0,f.jsx)(_t,{number:8}),(0,f.jsxs)(`p`,{children:[`Ranking quality tells the same story from another angle: an AUC of `,yt.auc.toFixed(3),` `,`means that given a random winner and a random loser, the model scores the winner higher about `,D(yt.auc,0),` of the time. Real signal, comfortably above chance, nowhere near decisive. Log loss lands at `,yt.logLoss.toFixed(3),`.`]}),(0,f.jsx)(ct,{number:9}),(0,f.jsxs)(`p`,{children:[`The errors are also symmetric — `,O(yt.confusion.fp),` matches called for A that B won,`,` `,O(yt.confusion.fn),` the other way. The model is not systematically biased toward favourites or underdogs. It is just uncertain, evenly.`]})]}),(0,f.jsxs)(Et,{id:`ceiling`,eyebrow:`07`,title:`The ceiling`,children:[(0,f.jsx)(`p`,{children:`One last check: is this a fixed property of the sport, or an artefact of a particular era being blended into the training set?`}),(0,f.jsx)(pt,{number:10}),(0,f.jsxs)(`p`,{children:[`Twenty-five seasons, four different world number ones, a complete turnover of the top hundred — and the favourite's win rate never leaves a narrow band around`,` `,D(j.dataset.favoriteWinRate,1),`. Whatever is generating the remaining`,` `,D(j.dataset.upsetRate,1),` of results is a stable feature of professional tennis, not a phase.`]}),(0,f.jsx)(Dt,{children:`The limit isn't the model. It's the information that exists before the first serve.`})]}),(0,f.jsxs)(Et,{id:`limits`,eyebrow:`08`,title:`What this cannot do`,children:[(0,f.jsx)(`p`,{children:`The project is deliberately narrow, and the narrowness is where the remaining performance is hiding. The model has no access to:`}),(0,f.jsxs)(`ul`,{className:`research__list`,children:[(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Recent form.`}),` A player three matches into a hot streak and one coming back from six weeks off look identical.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Head-to-head history.`}),` Styles make matchups; the model has never heard of a matchup.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Surface-specific ability.`}),` It knows the surface exists — the predictor does not even get that — but not that a given player is a clay specialist.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Fitness, injury, travel and scheduling.`}),` A retirement at 2–1 down counts the same as a straight-sets loss.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Anything in-match.`}),` Serve percentages and break points are recorded after the fact, so using them would be leakage, not prediction.`]})]}),(0,f.jsx)(`p`,{children:`There is also a structural caveat: ranking systems and tournament structures changed over the 25 seasons in the archive. Pooling them makes the task more realistic and the generalisation harder to reason about at the same time.`})]}),(0,f.jsxs)(Et,{id:`verdict`,eyebrow:`09`,title:`Verdict`,children:[(0,f.jsxs)(`p`,{className:`lead`,children:[`Rankings already know almost everything that pre-match data can know. A neural network adds `,(bt.lift*100).toFixed(1),` percentage points to a rule that fits in a sentence, and three unrelated model families independently confirm that the ceiling is real.`]}),(0,f.jsx)(`p`,{children:`The right way to use this system is as a probability estimator, not an oracle. It will tell you that a match is 78/22 and it will be approximately correct about what 78 means — and then the 22 will happen, about one time in five, because that is what 22 means. Tennis reserves roughly a third of its results for the player who was not supposed to win, and no amount of pre-match arithmetic gets those back.`}),(0,f.jsx)(`p`,{children:`Getting further requires better inputs, not better algorithms: form, head-to-head, surface-specific records, fatigue. That is the next version of this project. This version's contribution is knowing, with numbers attached, exactly how far four columns can carry you.`}),(0,f.jsxs)(`div`,{className:`methods`,children:[(0,f.jsx)(`h3`,{className:`methods__title`,children:`Methods, briefly`}),(0,f.jsxs)(`dl`,{className:`methods__grid`,children:[(0,f.jsxs)(At,{term:`Data`,children:[`Jeff Sackmann's ATP archive, `,j.dataset.firstYear,`–`,j.dataset.lastYear,`;`,` `,O(j.dataset.matches),` matches after cleaning.`]}),(0,f.jsx)(At,{term:`Features`,children:`Player-A-minus-player-B differences in ranking, ranking points, age and height.`}),(0,f.jsxs)(At,{term:`Split`,children:[`Chronological 80/20 — `,O(j.dataset.trainMatches),` train,`,` `,O(j.dataset.testMatches),` test.`]}),(0,f.jsxs)(At,{term:`Shipped model`,children:[`Scikit-learn `,(0,f.jsx)(`code`,{children:`MLPClassifier`}),`, hidden layers`,` `,ce.hidden.join(` and `),`, ReLU, Adam, early stopping — converged in`,` `,ce.iterations,` iterations behind a `,(0,f.jsx)(`code`,{children:`StandardScaler`}),`.`]}),(0,f.jsx)(At,{term:`Reported metrics`,children:`Accuracy, AUC and log loss on the held-out window; calibration in 5-point bins.`}),(0,f.jsx)(At,{term:`In this page`,children:`The network's weights are exported to JSON and run in y
