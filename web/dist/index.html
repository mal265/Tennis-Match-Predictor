me:`rhero__standfirst`,children:[`Eight models, `,O(F.dataset.matches),` ATP matches and four pre-match numbers. The best of them beat “just pick the higher-ranked player” by`,` `,(Kt.lift*100).toFixed(1),` percentage points. This is the story of why that number is so small — and why that is the interesting result, not the disappointing one.`]}),(0,f.jsxs)(`dl`,{className:`rhero__facts`,children:[(0,f.jsx)(Lt,{term:`Matches analysed`,detail:`${F.dataset.firstYear}–${F.dataset.lastYear}`,children:O(F.dataset.matches)}),(0,f.jsx)(Lt,{term:`Baseline accuracy`,detail:`higher rank wins`,children:D(Jt,1)}),(0,f.jsx)(Lt,{term:`Best model`,detail:Kt.name.toLowerCase(),children:D(Kt.accuracy,1)}),(0,f.jsx)(Lt,{term:`Matches won by the underdog`,detail:`the irreducible part`,children:D(F.dataset.upsetRate,1)})]})]})}),(0,f.jsx)(Gt,{current:1,onOpen:e}),(0,f.jsxs)(`div`,{className:`page research__layout`,children:[(0,f.jsxs)(`nav`,{className:`toc`,"aria-label":`Report contents`,children:[(0,f.jsx)(`p`,{className:`toc__title kicker`,children:`Contents`}),(0,f.jsx)(`ol`,{className:`toc__list`,children:Zt.map(e=>(0,f.jsx)(`li`,{children:(0,f.jsx)(`a`,{href:`#${e.id}`,"aria-current":t===e.id,children:e.label})},e.id))})]}),(0,f.jsxs)(`div`,{className:`research__body`,children:[(0,f.jsxs)(P,{id:`question`,eyebrow:`01`,title:`The question`,children:[(0,f.jsx)(`p`,{className:`lead`,children:`Before a match starts, what do we actually know? A ranking, a points total, two ages and two heights. The question this project set out to answer is whether that is enough — and, more pointedly, whether a machine-learning model can squeeze anything out of it that a tennis fan couldn't get by simply backing the better-ranked player.`}),(0,f.jsxs)(`p`,{children:[`That second half matters. Beating chance is trivial here: the favourite wins`,` `,D(F.dataset.favoriteWinRate,1),` of the time, so a rule with no model in it at all is already right about two matches in three. The bar is not 50%. The bar is`,` `,D(Jt,1),`, and it is a genuinely hard bar to clear.`]}),(0,f.jsx)(Ft,{children:`The competition isn't chance. It's a one-line rule that already works.`})]}),(0,f.jsxs)(P,{id:`data`,eyebrow:`02`,title:`The data`,children:[(0,f.jsxs)(`p`,{children:[`The archive covers `,O(F.dataset.matches),` ATP matches between`,` `,F.dataset.firstYear,` and `,F.dataset.lastYear,` —`,` `,O(F.dataset.players),` players across `,O(F.dataset.tournaments),` tournaments, from Jeff Sackmann's public dataset. Matches missing a surface or either player's ranking were dropped; missing heights were filled with the column median.`]}),(0,f.jsxs)(`p`,{children:[`Each match becomes one row with a coin-flip assignment: one player is arbitrarily labelled A, and the model predicts whether A won. Every input is a difference —`,` `,(0,f.jsx)(`code`,{children:`rank_diff`}),`, `,(0,f.jsx)(`code`,{children:`points_diff`}),`, `,(0,f.jsx)(`code`,{children:`age_diff`}),`,`,` `,(0,f.jsx)(`code`,{children:`height_diff`}),` — so the model never learns that a particular name wins, only that a particular `,(0,f.jsx)(`em`,{children:`gap`}),` wins.`]}),(0,f.jsxs)(It,{title:`Why the split is by date, not at random`,children:[`Shuffling the rows would let the model train on 2023 and predict 2019, which is not a forecast — it is hindsight. Everything here trains on the earliest`,` `,O(F.dataset.trainMatches),` matches and is tested on the most recent`,` `,O(F.dataset.testMatches),`. Accuracies come out lower this way. They also mean something.`]})]}),(0,f.jsxs)(P,{id:`scoreboard`,eyebrow:`03`,title:`The scoreboard`,children:[(0,f.jsxs)(`p`,{children:[`Eight approaches were tested: the favourite-wins rule, logistic regression, a decision tree, a random forest, gradient boosting, k-nearest neighbours, a linear SVM, and a neural network. They span most of the standard toolkit, from a one-line heuristic to a`,` `,ht.hidden.join(`–`),` hidden-unit network.`]}),(0,f.jsx)(St,{number:1}),(0,f.jsxs)(`p`,{children:[`The spread from best to worst is `,((Kt.accuracy-qt.accuracy)*100).toFixed(1),` `,`percentage points. `,Kt.name,` tops the table at `,D(Kt.accuracy,1),`;`,` `,qt.name.toLowerCase(),` sits at the bottom on `,D(qt.accuracy,1),`, the only model that fails to beat the baseline at all. Everything else is bunched inside half a point of a rule you could write on a napkin.`]}),(0,f.jsx)(`p`,{children:`It is tempting to read that as failure. It is better read as a measurement: when a linear model, a tree ensemble and a neural network all converge on the same number, the ceiling is not in the algorithm. It is in the data.`})]}),(0,f.jsxs)(P,{id:`signal`,eyebrow:`04`,title:`Where the signal is`,children:[(0,f.jsx)(`p`,{children:`If the four inputs are the whole world the model can see, it is worth asking which of them it is actually using. Three different models, scored three different ways, agree on the shape of the answer — with one wrinkle.`}),(0,f.jsx)(Ct,{number:2}),(0,f.jsxs)(`p`,{children:[`Age and height are close to noise. Shuffling height costs the network`,` `,(F.importance[3].permutation*100).toFixed(1),` percentage points of accuracy; shuffling age costs `,(F.importance[2].permutation*100).toFixed(1),`. Neither is doing meaningful work.`]}),(0,f.jsxs)(`p`,{children:[`The wrinkle is that ranking and ranking points split the credit unevenly, and not in the direction the summary usually claims. The decision tree gives`,` `,D(F.importance[1].treeImportance,0),` of its importance to`,` `,(0,f.jsx)(`em`,{children:`points`}),`, not rank. That is not a contradiction — it is collinearity. The two columns encode nearly the same fact, so a model picks one, leans on it, and leaves the other looking idle. The honest statement is that `,(0,f.jsx)(`strong`,{children:`ranking information`}),` `,`dominates, and which of its two columns carries that information is close to arbitrary.`]}),(0,f.jsx)(Pt,{number:3}),(0,f.jsx)(`p`,{children:`The learned curve is flatter than intuition expects. A 100-place ranking advantage does not make a match a formality; it moves the needle to roughly the low seventies. Beyond about 150 places the curve barely climbs at all — the model has run out of things to say, because a #200 and a #400 look much the same from where it is standing.`})]}),(0,f.jsxs)(P,{id:`easy`,eyebrow:`05`,title:`When prediction gets easy`,children:[(0,f.jsx)(`p`,{children:`Aggregate accuracy hides an important structure: the model is not uniformly mediocre. It is nearly useless in some matches and quite good in others, and the ranking gap is what separates the two.`}),(0,f.jsx)(Ot,{number:4}),(0,f.jsxs)(`p`,{children:[`Between players within `,Xt.label,` ranking places of each other, the baseline is right `,D(Xt.baseline,1),` of the time — a coin flip with extra steps. Past`,` `,Yt.label,` places apart, it climbs to `,D(Yt.baseline,1),`. The predictable matches are the mismatches, and the mismatches are the ones nobody needed a model for.`]}),(0,f.jsx)(`p`,{children:`The obvious next suspects are surface and format. Surface turns out to matter remarkably little.`}),(0,f.jsx)(Dt,{number:5}),(0,f.jsxs)(`p`,{children:[`Across `,O(F.dataset.matches),` matches the gap between the most and least favourite-friendly surface is`,` `,((F.bySurface[0].favoriteWinRate-Math.min(...F.bySurface.map(e=>e.favoriteWinRate)))*100).toFixed(1),` `,`percentage points. Clay's reputation for producing specialists and upsets does not show up at this resolution.`]}),(0,f.jsx)(`p`,{children:`Format, on the other hand, does.`}),(0,f.jsx)(At,{number:6}),(0,f.jsxs)(`p`,{children:[`Favourites win `,D(F.byLevel[1].favoriteWinRate,1),` of Grand Slam matches against`,` `,D(F.byLevel[F.byLevel.length-1].favoriteWinRate,1),` on the regular tour. Best-of-five is a longer measurement of the same quantity, and longer measurements are less noisy. An underdog needs to be better for three hours, not for forty minutes.`]})]}),(0,f.jsxs)(P,{id:`confidence`,eyebrow:`06`,title:`Trusting the number`,children:[(0,f.jsx)(`p`,{children:`Accuracy is a blunt way to judge a forecaster. A model that says “72%” and is right 72% of the time is doing its job even when it loses individual matches. So the more useful question is whether the probabilities mean what they say.`}),(0,f.jsx)(Mt,{number:7}),(0,f.jsx)(`p`,{children:`Mostly, they do. Through the middle of the range the points sit close to the diagonal, which is the property that makes the output usable as a probability rather than a verdict. The tails drift — at the extremes the model is a little more confident than the results justify, which is exactly where a bettor would get hurt.`}),(0,f.jsx)(Nt,{number:8}),(0,f.jsxs)(`p`,{children:[`Ranking quality tells the same story from another angle: an AUC of `,I.auc.toFixed(3),` `,`means that given a random winner and a random loser, the model scores the winner higher about `,D(I.auc,0),` of the time. Real signal, comfortably above chance, nowhere near decisive. Log loss lands at `,I.logLoss.toFixed(3),`.`]}),(0,f.jsx)(wt,{number:9}),(0,f.jsxs)(`p`,{children:[`The errors are also symmetric — `,O(I.confusion.fp),` matches called for A that B won,`,` `,O(I.confusion.fn),` the other way. The model is not systematically biased toward favourites or underdogs. It is just uncertain, evenly.`]})]}),(0,f.jsxs)(P,{id:`ceiling`,eyebrow:`07`,title:`The ceiling`,children:[(0,f.jsx)(`p`,{children:`One last check: is this a fixed property of the sport, or an artefact of a particular era being blended into the training set?`}),(0,f.jsx)(kt,{number:10}),(0,f.jsxs)(`p`,{children:[`Twenty-five seasons, four different world number ones, a complete turnover of the top hundred — and the favourite's win rate never leaves a narrow band around`,` `,D(F.dataset.favoriteWinRate,1),`. Whatever is generating the remaining`,` `,D(F.dataset.upsetRate,1),` of results is a stable feature of professional tennis, not a phase.`]}),(0,f.jsx)(Ft,{children:`The limit isn't the model. It's the information that exists before the first serve.`})]}),(0,f.jsxs)(P,{id:`limits`,eyebrow:`08`,title:`What this cannot do`,children:[(0,f.jsx)(`p`,{children:`The project is deliberately narrow, and the narrowness is where the remaining performance is hiding. The model has no access to:`}),(0,f.jsxs)(`ul`,{className:`research__list`,children:[(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Recent form.`}),` A player three matches into a hot streak and one coming back from six weeks off look identical.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Head-to-head history.`}),` Styles make matchups; the model has never heard of a matchup.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Surface-specific ability.`}),` None of the four inputs mentions the surface, so a clay specialist looks identical everywhere.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Fitness, injury, travel and scheduling.`}),` A retirement at 2–1 down counts the same as a straight-sets loss.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`strong`,{children:`Anything in-match.`}),` Serve percentages and break points are recorded after the fact, so using them would be leakage, not prediction.`]})]}),(0,f.jsx)(`p`,{children:`Report 2 builds three of these — surface, head-to-head and rest — out of the same archive, and measures exactly what each one is worth.`}),(0,f.jsx)(`p`,{children:`There is also a structural caveat: ranking systems and tournament structures changed over the 25 seasons in the archive. Pooling them makes the task more realistic and the generalisation harder to reason about at the same time.`})]}),(0,f.jsxs)(P,{id:`verdict`,eyebrow:`09`,title:`Verdict`,children:[(0,f.jsxs)(`p`,{className:`lead`,children:[`Rankings already know almost everything that pre-match data can know. A neural network adds `,(Kt.lift*100).toFixed(1),` percentage points to a rule that fits in a sentence, and three unrelated model families independently confirm that the ceiling is real.`]}),(0,f.jsx)(`p`,{children:`The right way to use this system is as a probability estimator, not an oracle. It will tell you that a match is 78/22 and it will be approximately correct about what 78 means — and then the 22 will happen, about one time in five, because that is what 22 means. Tennis reserves roughly a third of its results for the player who was not supposed to win, and no amount of pre-match arithmetic gets those back.`}),(0,f.jsx)(`p`,{children:`Getting further requires better inputs, not better algorithms: form, head-to-head, surface-specific records, fatigue. That is precisely what Report 2 tests. This report's contribution is knowing, with numbers attached, exactly how far four columns can carry you.`}),(0,f.jsx)(`p`,{children:(0,f.jsxs)(`button`,{className:`btn-ball`,onClick:()=>e(2),children:[`Continue to Report 2 `,(0,f.jsx)(b,{})]})}),(0,f.jsxs)(`div`,{className:`methods`,children:[(0,f.jsx)(`h3`,{className:`methods__title`,children:`Methods, briefly`}),(0,f.jsxs)(`dl`,{className:`methods__grid`,children:[(0,f.jsxs)(Rt,{term:`Data`,children:[`Jeff Sackmann's ATP archive, `,F.dataset.firstYear,`–`,F.dataset.lastYear,`;`,` `,O(F.dataset.matches),` matches after cleaning.`]}),(0,f.jsx)(Rt,{term:`Features`,children:`Player-A-minus-player-B differences in ranking, ranking points, age and height.`}),(0,f.jsxs)(Rt,{term:`Split`,children:[`Chronological 80/20 — `,O(F.dataset.trainMatches),` train,`,` `,O(F.dataset.testMatches),` test.`]}),(0,f.jsxs)(Rt,{term:`Model in this report`,children:[`Scikit-learn `,(0,f.jsx)(`code`,{children:`MLPClassifier`}),`, hidden layers`,` `,ht.hidden.join(` and `),`, ReLU, Adam, early stopping — converged in`,` `,ht.iterations,` iterations behind a `,(0,f.jsx)(`code`,{children:`StandardScaler`}),`.`]}),(0,f.jsx)(Rt,{term:`Reported metrics`,children:`Accuracy, AUC and log loss on the held-out window; calibration in 5-point bins.`}),(0,f.jsx)(Rt,{term:`In this page`,children:`The network's weights are exported wins minus prior losses) · rest gap (days since each player's last match) · experience gap (career matches played). Each is player A minus player B, exactly as in Report 1.`})]}),(0,f.jsxs)(P,{id:`elo`,eyebrow:`03`,title:`A rating that learns from every match`,children:[(0,f.jsx)(`p`,{children:`Elo ratings come from chess. Every player starts at 1,500, and before each match the two ratings imply an expected result: a player rated 200 points higher is expected to win about 76% of the time. Afterwards the winner takes points from the loser in proportion to how surprising the result was. An upset moves both ratings a lot; a routine win barely moves them.`}),(0,f.jsx)(`p`,{children:`This version adds one refinement: the step size shrinks as a player's match count grows. A newcomer's rating can climb quickly to where it belongs, while an established player's rating stays put unless the results keep saying otherwise.`}),(0,f.jsxs)(`p`,{children:[`With no model at all — just “the higher Elo wins” — the rating is right`,` `,D(L.singles.eloRule,2),` of the time. Report 1's neural network managed`,` `,D(vn.neuralNetwork.accuracy,2),`. A rating formula from the 1960s matches Report 1's most elaborate model before any machine learning is applied to it.`]}),(0,f.jsx)(on,{number:1}),(0,f.jsxs)(`p`,{children:[`Before trusting ratings with predictions, it is worth checking that they describe tennis as a fan would recognise it. They do: `,kn.name,`'s peak of`,` `,Math.round(kn.rating),` in `,ge(kn.date),` is the highest in the archive, and every name on the lists is one you would expect to find there.`]}),(0,f.jsx)(mn,{number:2}),(0,f.jsxs)(`p`,{children:[`The histories show how the ratings are earned. Jannik Sinner climbed`,` `,O(Ln(`Jannik Sinner`)),` points from a first rating to a peak, and Carlos Alcaraz`,` `,O(Ln(`Carlos Alcaraz`)),`, while the long plateaus of the three older players move only when a sustained run of results says they should.`]})]}),(0,f.jsxs)(P,{id:`surface`,eyebrow:`04`,title:`One rating per surface`,children:[(0,f.jsxs)(`p`,{children:[`A single rating treats a clay-court specialist identically on grass. So each player also carries a separate rating for every surface, updated only by matches played on it. The spread can be enormous: Jannik Sinner rates`,` `,Math.round(Mn.rating.surfaces.Hard.rating),` on hard courts and`,` `,Math.round(Mn.rating.surfaces.Grass.rating),` on grass.`]}),(0,f.jsxs)(`p`,{children:[`Adding surface ratings to overall Elo lifts accuracy from `,D(Sn.accuracy,2),` to`,` `,D(Cn.accuracy,2),` — the largest single addition in the study, and the first of Report 2's steps whose interval clears zero. It is also why the surface matters so much in the predictor: Sinner against Djokovic goes from`,` `,D(Fn,0),` on hard courts to `,D(In,0),` on grass.`]})]}),(0,f.jsxs)(P,{id:`context`,eyebrow:`05`,title:`Form, rivalry, rest and mileage`,children:[(0,f.jsx)(`p`,{children:`Four more signals are cheap to compute from the archive. Three earned a place in the final model; the most intuitive one did not.`}),(0,f.jsx)(`h3`,{className:`rsection__sub`,children:`Recent form made it worse`}),(0,f.jsxs)(`p`,{children:[`Win rate over each player's last ten matches sounds like exactly what a ranking misses. Added on top of the two ratings, it lowered accuracy from`,` `,D(Cn.accuracy,2),` to `,D(wn.accuracy,2),`. The likeliest explanation is that Elo already is a measure of recent form — every result moves it — so a raw win rate adds noise rather than information. It was left out of the final model.`]}),(0,f.jsx)(`h3`,{className:`rsection__sub`,children:`Head-to-head`}),(0,f.jsxs)(`p`,{children:[D(L.context.rematchShare,0),` of held-out matches were rematches, so a rivalry record is often available. The edge is simply prior wins minus prior losses against this opponent. Some rivalries are almost perfectly level: `,An.a,` and `,An.b,` `,`met `,An.aWins+An.bWins,` times in the archive and finished`,` `,An.aWins,`–`,An.bWins,`. Added to the ratings it is worth `,Rn(`h2h`),` `,`points.`]}),(0,f.jsx)(`h3`,{className:`rsection__sub`,children:`Rest and experience`}),(0,f.jsxs)(`p`,{children:[`Days since each player's last match (`,Rn(`rest`),` points) and career matches played (`,Rn(`experience`),`) both carry signs that look backwards at first. More rest than the opponent slightly `,(0,f.jsx)(`em`,{children:`lowers`}),` a player's chances; the likeliest reason is that long gaps in the archive follow injuries and withdrawals rather than holidays. And once the ratings are known, more career matches is a mild negative too: between two equally rated players, the one with fewer matches is most likely the younger player still improving.`]}),(0,f.jsxs)(`p`,{children:[`How rest is measured matters. Raw day counts (`,D(L.restVariants.raw,2),`) beat capping every gap at 60 days (`,D(L.restVariants.capped,2),`), which suggests the signal lives in the very long absences in particular.`]})]}),(0,f.jsxs)(P,{id:`scoreboard`,eyebrow:`06`,title:`The scoreboard, with error bars`,children:[(0,f.jsx)(`p`,{children:`A difference of a few tenths of a point can be pure luck on a test set of this size. So every model below is compared with the baseline on the same held-out matches, and the uncertainty is drawn rather than hidden.`}),(0,f.jsx)(rn,{number:3}),(0,f.jsxs)(`p`,{children:[`The final model is right `,D(En,2),` of the time:`,` `,k(Tn.lift),` points over the baseline, with a 95% interval of`,` `,k(Tn.ciLow),` to `,k(Tn.ciHigh),` and a McNemar p-value`,` `,zn(Tn.pValue),`. Elo on its own is not distinguishable from the baseline; it is the combination of ratings and context that clears the noise.`]}),(0,f.jsx)(`h3`,{className:`rsection__sub`,children:`Against Report 1 directly`}),(0,f.jsxs)(`p`,{children:[`Measured against Report 1's model instead of the baseline, the final model gains`,` `,k(Dn.lift),` points of accuracy, with a 95% interval of`,` `,k(Dn.ciLow),` to `,k(Dn.ciHigh),` (`,Bn(Dn.pValue),`).`,` `,Vn?`That interval clears zero as well.`:`That interval just includes zero, so on accuracy alone the improvement over Report 1 is suggestive rather than conclusive.`]}),(0,f.jsxs)(`p`,{children:[`Accuracy is a blunt instrument, though: it only asks which side of 50% a prediction fell. Comparing the probabilities themselves, match by match, average log loss moves from `,On.logLoss.reference.toFixed(4),` to `,On.logLoss.model.toFixed(4),Hn?` — an improvement whose 95% interval clears zero (${Bn(On.logLoss.pValue)}), and the Brier score agrees. Report 2's probabilities are measurably sharper than Report 1's, even on the matches where both models make the same call.`:`, but that interval also includes zero (${Bn(On.logLoss.pValue)}). A longer test window would be needed to settle the comparison.`]})]}),(0,f.jsxs)(P,{id:`where`,eyebrow:`07`,title:`Where the gain lives`,children:[(0,f.jsx)(`p`,{children:`An average hides where a model earns its keep. Split by how far apart the players are ranked, Report 2's advantage turns up in exactly the matches Report 1 found hardest.`}),(0,f.jsx)(hn,{number:4}),(0,f.jsxs)(`p`,{children:[`When the players are within eight ranking places, the baseline is right only`,` `,D(L.rankBands[0].baseline,0),`–`,D(L.rankBands[1].baseline,0),` of the time, and Report 2 adds `,k(L.rankBands[0].finalLift),` and`,` `,k(L.rankBands[1].finalLift),` points. Ratings built from results can separate two players whose rankings cannot. In the widest mismatches, where the ranking already calls three matches in four, Report 2 does slightly worse than the baseline.`]}),(0,f.jsx)(gn,{number:5}),(0,f.jsxs)(`p`,{children:[`Two inputs carry nearly all of the model's skill. Shuffling the Elo gap costs`,` `,(L.importance[0].drop*100).toFixed(2),` points of accuracy and shuffling the surface gap `,(L.importance[1].drop*100).toFixed(2),`; each of the other three costs well under a quarter of a point.`]})]}),(0,f.jsxs)(P,{id:`trust`,eyebrow:`08`,title:`Trusting t
